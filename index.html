<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%239E1F16'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23FFE7A3' font-family='serif'%3E戏%3C/text%3E%3C/svg%3E">
<style>
/* 适老化:字大、对比强、按钮大且间距宽,不依赖悬停和手势。
   为照顾老旧手机浏览器,CSS 不用 aspect-ratio / inset,JS 不用 ?. 和 ??。 */
:root {
  --bg: #FBF5EA;
  --card: #FFFFFF;
  --ink: #2A1810;
  --ink2: #5B4434;
  --line: #E3D2BC;
  --red: #9E1F16;
  --red-soft: #FFF0EA;
  --dark: #2A1810;
}
* { box-sizing: border-box; }
html { font-size: 20px; -webkit-text-size-adjust: 100%; }
html.big { font-size: 23px; }
html.huge { font-size: 26px; }
body {
  margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5;
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: rgba(0,0,0,.08); }
button:focus-visible { outline: 4px solid #F2B705; outline-offset: 2px; }

.bar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
  min-height: 3.4rem; padding: .35rem 16px; background: var(--red); color: #fff;
}
.bar h1 { flex: 1; margin: 0; font-size: 1.45rem; letter-spacing: .15em; text-align: center; }
.back {
  min-height: 2.7rem; padding: 0 .8rem; font-size: 1.05rem; font-weight: 700;
  border: 2px solid rgba(255,255,255,.85); border-radius: .7rem; background: transparent; color: #fff;
}
.bar .spacer { width: 4.6rem; }

main { max-width: 720px; margin: 0 auto; padding: 16px 16px 8rem; }
.view { display: none; }
.view.active { display: block; }
h2 { margin: .2rem 0 .8rem; font-size: 1.5rem; }
.lead { margin: 0 0 1rem; font-size: 1.05rem; color: var(--ink2); }

.grid { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 14px; }
.tile {
  min-height: 6rem; padding: .6rem; border: 0; border-radius: 1rem; color: #fff;
  font-size: 1.75rem; font-weight: 700; letter-spacing: .08em; line-height: 1.25;
  box-shadow: 0 4px 0 rgba(0,0,0,.22);
}
.tile.long { padding: .6rem .3rem; font-size: 1.2rem; letter-spacing: 0; }
.tile small { display: block; margin-top: .25rem; font-size: .8rem; font-weight: 400; letter-spacing: 0; }
.tile:active, .item:active, .wide:active, .ctl:active { transform: translateY(2px); }

.wide {
  display: block; width: 100%; min-height: 4rem; margin: 0 0 14px; padding: .6rem 1rem;
  border: 0; border-radius: 1rem; font-size: 1.3rem; font-weight: 700;
  background: var(--dark); color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25);
}
.wide.light { background: var(--card); color: var(--ink); border: 3px solid var(--red); box-shadow: none; }
.wide .sub { display: block; font-size: .95rem; font-weight: 400; }

.items { list-style: none; margin: 0; padding: 0; }
.items li { margin-bottom: 12px; }
.item {
  display: block; width: 100%; min-height: 4.6rem; padding: .7rem 1rem; text-align: left;
  background: var(--card); border: 2px solid var(--line); border-radius: .9rem;
}
.item .a { display: block; font-size: 1.25rem; font-weight: 700; line-height: 1.35; }
.item .m { display: block; margin-top: .15rem; font-size: 1rem; color: var(--ink2); }
.item .d { display: block; font-size: .85rem; color: var(--ink2); }
.item.on { border-color: var(--red); background: var(--red-soft); }
.item.on .a:before { content: "▶ "; color: var(--red); }
.empty { padding: 1rem; font-size: 1.1rem; background: var(--card); border: 2px dashed var(--line); border-radius: .9rem; }

.settings { margin-top: 1.6rem; padding: .8rem 1rem; background: var(--card); border: 2px solid var(--line); border-radius: .9rem; }
.settings .label { font-size: 1.05rem; font-weight: 700; }
.seg { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-gap: 10px; margin-top: .5rem; }
.seg button { min-height: 3.2rem; border: 2px solid var(--line); border-radius: .7rem; background: var(--bg); font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
.foot { margin-top: 1.2rem; font-size: .9rem; color: var(--ink2); }

/* 播放页:不播放时整块挪到屏幕外而不是 display:none,免得浏览器把隐藏的播放器暂停掉。 */
.player { display: block; }
.player.parked { position: fixed; left: -10000px; top: 0; width: 360px; }
.now-aria { font-size: 1.5rem; font-weight: 700; line-height: 1.3; }
.now-meta { margin: .2rem 0 .7rem; font-size: 1.1rem; color: var(--ink2); }
.screen { position: relative; width: 100%; background: #000; border-radius: .7rem; overflow: hidden; }
.screen:before { content: ""; display: block; padding-top: 56.25%; }
.screen iframe, .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
.overlay {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 1rem; background: #1D120C; color: #fff; text-align: center; font-size: 1.2rem;
}
.overlay[hidden] { display: none; }
.hint { margin: .5rem 0 0; font-size: 1rem; color: var(--ink2); }
.banner {
  margin-top: 12px; padding: .8rem 1rem; border-radius: .9rem; background: #FFF6D6;
  border: 3px solid #E0B000; font-size: 1.15rem; font-weight: 700;
}
.banner[hidden] { display: none; }
.banner button { display: block; width: 100%; min-height: 3.2rem; margin-top: .6rem; border: 2px solid var(--ink); border-radius: .7rem; background: #fff; font-weight: 700; }

.controls { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 12px; margin-top: 14px; }
.controls .primary { grid-column: 1 / 3; }
.ctl {
  min-height: 4.6rem; padding: .4rem; border: 3px solid var(--ink); border-radius: 1rem;
  background: var(--card); font-size: 1.15rem; font-weight: 700; line-height: 1.2;
}
.ctl svg { display: block; width: 1.7rem; height: 1.7rem; margin: 0 auto .2rem; fill: currentColor; }
.ctl.primary { min-height: 4.2rem; background: var(--red); border-color: var(--red); color: #fff; font-size: 1.45rem; }
.ctl.primary svg { display: inline-block; margin: 0 .4rem 0 0; vertical-align: -.3rem; }
.ctl.small { min-height: 3.8rem; font-size: 1rem; }
.ctl.small small { display: block; margin-top: .1rem; font-size: .85rem; font-weight: 400; }
.ctl[aria-pressed="true"] { background: #FFE7A3; }
.ctl:disabled { opacity: .35; }
.pulse { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 .45rem rgba(158,31,22,.35); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; box-shadow: 0 0 0 .3rem rgba(158,31,22,.45); } }
.src { margin-top: 1rem; font-size: .85rem; color: var(--ink2); word-break: break-all; }

.mini {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; align-items: stretch;
  padding: 10px 16px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); background: var(--dark); color: #fff;
}
.mini[hidden] { display: none; }
.mini-open { flex: 1; min-height: 3.6rem; margin-right: 10px; padding: .3rem .8rem; text-align: left; border: 2px solid #fff; border-radius: .8rem; background: transparent; color: #fff; }
.mini-open span { display: block; font-size: .85rem; }
.mini-open b { display: block; font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-stop { min-width: 5rem; border: 0; border-radius: .8rem; background: #fff; color: var(--dark); font-size: 1.15rem; font-weight: 700; }
</style>

{"genre": "晋剧", "play": "打金枝", "aria": "劝宫", "artist": "王爱爱", "school": "", "bvid": "BV1Wv411a7dY", "p": 1, "t": 0, "dur": 440, "note": "1979年录制", "src": "松子哥哥的弟弟｜【晋剧经典】《打金枝•劝宫》王爱爱 1979年录制"},
{"genre": "晋剧", "play": "坐楼杀惜", "aria": "紧流水", "artist": "丁果仙、郭兰英", "school": "", "bvid": "BV1jZ4y1m7SK", "p": 1, "t": 0, "dur": 232, "note": "1961年实况录音", "src": "晋青会韩大卫｜【丁果仙 郭兰英】超快节奏晋剧——紧流水（简介：坐楼杀惜，1961年实况录音）"},
{"genre": "川剧", "play": "别宫出征", "aria": "坐着坐着生杀气", "artist": "陈书舫", "school": "", "bvid": "BV1kK411n7uP", "p": 1, "t": 0, "dur": 133, "note": "高腔", "src": "周浦大宝贝｜【川剧名家名段（高腔）】《别宫出征》“坐着坐着生杀气”陈书舫"},
{"genre": "川剧", "play": "思凡", "aria": "思凡", "artist": "沈铁梅", "school": "", "bvid": "BV11b411x7Be", "p": 1, "t": 0, "dur": 482, "note": "", "src": "女裙钗｜川剧《思凡》选段    沈铁梅"},
{"genre": "粤剧", "play": "昭君出塞", "aria": "昭君出塞", "artist": "红线女", "school": "红派", "bvid": "BV1QY411T7Tt", "p": 1, "t": 0, "dur": 598, "note": "", "src": "水月纸灯｜[4k]红线女-昭君出塞"},
{"genre": "粤剧", "play": "荔枝颂", "aria": "荔枝颂", "artist": "红线女", "school": "红派", "bvid": "BV1xs41147F2", "p": 1, "t": 0, "dur": 273, "note": "粤曲", "src": "寒夜琴挑｜广东《荔枝颂》红线女"}
]
</script>

<script>
(function () {
  "use strict";

  var MAIN_GENRES = ["京剧", "豫剧", "越剧", "黄梅戏", "评剧", "昆曲"];
  var MORE_ORDER = ["曲剧", "越调", "秦腔", "河北梆子", "晋剧", "川剧", "粤剧"];
  var GENRE_COLORS = {
    "京剧": "#A3231A", "豫剧": "#A04A10", "越剧": "#1C6585", "黄梅戏": "#2E6E37",
    "评剧": "#71398F", "昆曲": "#7A5410", "更多": "#4E3A2E", "收藏": "#8E1F45"
  };
  var LOAD_DELAY = 2.5;      // iframe 加载到出声大约要这么久,计时从这之后开始
  var END_GRACE = 3;         // 估计唱完后再多等几秒才算结束
  var COUNTDOWN = 8;         // 自动下一段前的倒计时
  var SLEEP_STEPS = [0, 15, 30, 60];

  var CATALOG = JSON.parse(document.getElementById("catalog").textContent);
  var byId = {};
  CATALOG.forEach(function (e) {
    e.p = e.p || 1;
    e.t = e.t || 0;
    e.id = e.bvid + "-" + e.p + "-" + e.t;
    byId[e.id] = e;
  });

  // ---------- 本机存储(隐私模式下可能不可用,一律兜底) ----------
  function load(key, fallback) {
    try { var v = localStorage.getItem("xiqu." + key); return v === null ? fallback : JSON.parse(v); }
    catch (err) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem("xiqu." + key, JSON.stringify(value)); } catch (err) { /* 存不了就算了 */ }
  }

  var favs = load("fav", []).filter(function (id) { return byId[id]; });
  var prefs = load("prefs", { size: "", autoNext: true });

  var $ = function (id) { return document.getElementById(id); };
  var frame = $("frame");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function minutes(sec) { return "约" + Math.max(1, Math.round(sec / 60)) + "分钟"; }
  function segLen(e) { return Math.max(1, (e.dur || 0) - e.t); }
  function genreOf(name) { return CATALOG.filter(function (e) { return e.genre === name; }); }
  function genres() {
    var seen = [];
    CATALOG.forEach(function (e) { if (seen.indexOf(e.genre) < 0) seen.push(e.genre); });
    return seen;
  }
  function moreGenres() {
    return genres().filter(function (g) { return MAIN_GENRES.indexOf(g) < 0; }).sort(function (a, b) {
      var ia = MORE_ORDER.indexOf(a), ib = MORE_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
  }
  function metaLine(e) {
    var play = e.play === e.aria ? "" : "《" + e.play + "》 ";   // 「夫妻观灯」不再重复《夫妻观灯》
    return play + e.artist + (e.school ? "（" + e.school + "）" : "");
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // ---------- 字号 ----------
  function applySize() {
    document.documentElement.className = prefs.size || "";
    [].forEach.call($("sizeSeg").querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", String((b.getAttribute("data-size") || "") === (prefs.size || "")));
    });
  }
  $("sizeSeg").addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    prefs.size = b.getAttribute("data-size") || "";
    save("prefs", prefs);
    applySize();
  });

  // ---------- 页面切换(用 #地址,手机的返回键也能一级级退回来) ----------
  var stack = [];
  var replacing = false;
  function go(hash) { location.hash = hash; }
  function replaceHash(hash) { replacing = true; location.replace(hash); }
  function parentOf(hash) {
    var parts = hash.split("/");
    if (parts[1] === "play") return state.listHash || "#/";
    if (parts[1] === "g" && MAIN_GENRES.indexOf(decodeURIComponent(parts[2] || "")) < 0) return "#/more";
    return "#/";
  }
  // 返回键防连点:老人常连按两下,第二下若在第一次跳转完成前生效,会连退两级甚至退出页面
  var navBusy = false;
  function backTo(target) {
    if (navBusy) return;
    navBusy = true;
    setTimeout(function () { navBusy = false; }, 800);
    if (stack.length > 1 && (!target || stack[stack.length - 2] === target)) history.back();
    else if (target) go(target);
    else replaceHash(parentOf(location.hash));
  }
  $("backBtn").addEventListener("click", function () { backTo(); });

  function route() {
    var hash = location.hash || "#/";
    if (replacing && stack.length) stack[stack.length - 1] = hash;
    else if (stack.length > 1 && stack[stack.length - 2] === hash) stack.pop();
    else if (stack[stack.length - 1] !== hash) stack.push(hash);
    replacing = false;
    navBusy = false;

    var parts = hash.split("/");
    var page = parts[1] || "";
    var arg = decodeURIComponent(parts[2] || "");
    var isHome = page === "";

    ["v-home", "v-more", "v-list"].forEach(function (id) { $(id).classList.remove("active"); });
    $("backBtn").hidden = isHome;
    $("backSpacer").hidden = !isHome;

    if (page === "play" && byId[arg]) {
      showPlayer(byId[arg]);
    } else {
      parkPlayer();
      if (page === "g" && genreOf(arg).length) showList(arg, genreOf(arg), "#/g/" + encodeURIComponent(arg));
      else if (page === "fav") showList("收藏", favs.map(function (id) { return byId[id]; }), "#/fav");
      else if (page === "more") { $("barTitle").textContent = "更多剧种"; $("v-more").classList.add("active"); }
      else { $("barTitle").textContent = "听戏"; renderHome(); $("v-home").classList.add("active"); }
    }
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);

  // ---------- 首页 ----------
  function tile(label, sub, color, onClick) {
    var b = el("button", label.length > 3 ? "tile long" : "tile", label);
    b.type = "button";
    b.style.background = color;
    b.appendChild(el("small", "", sub));
    b.addEventListener("click", onClick);
    return b;
  }
  function renderHome() {
    var grid = $("genreGrid");
    grid.innerHTML = "";
    MAIN_GENRES.forEach(function (g) {
      var n = genreOf(g).length;
      if (!n) return;
      grid.appendChild(tile(g, n + " 段名段", GENRE_COLORS[g], function () { go("#/g/" + encodeURIComponent(g)); }));
    });
    var more = moreGenres();
    if (more.length) {
      grid.appendChild(tile("更多剧种", more.slice(0, 3).join("、") + "…", GENRE_COLORS["更多"], function () { go("#/more"); }));
    }
    grid.appendChild(tile("我的收藏", favs.length ? favs.length + " 段" : "还没有", GENRE_COLORS["收藏"], function () { go("#/fav"); }));

    var mg = $("moreGrid");
    mg.innerHTML = "";
    more.forEach(function (g) {
      mg.appendChild(tile(g, genreOf(g).length + " 段名段", GENRE_COLORS["更多"], function () { go("#/g/" + encodeURIComponent(g)); }));
    });

    var box = $("resume");
    box.innerHTML = "";
    var last = load("last", null);
    var e = last && byId[last.id];
    if (e && !(state.cur && state.playing)) {
      var b = el("button", "wide light");
      b.type = "button";
      b.appendChild(document.createTextNode("接着听上次的"));
      b.appendChild(el("span", "sub", "「" + e.aria + "」 " + e.artist));
      b.addEventListener("click", function () {
        var list = last.queue && last.queue.filter(function (id) { return byId[id]; });
        startQueue(list && list.length ? list : genreOf(e.genre).map(function (x) { return x.id; }), e.id, last.pos || 0, last.listHash);
      });
      box.appendChild(b);
    }
  }
  $("randomBtn").addEventListener("click", function () {
    var ids = shuffle(CATALOG).map(function (e) { return e.id; });
    startQueue(ids, ids[0], 0, "#/");
  });

  // ---------- 唱段列表 ----------
  function showList(title, entries, hash) {
    $("barTitle").textContent = title;
    $("listTitle").textContent = title === "收藏" ? "我收藏的唱段" : title + " · 名家名段";
    var ol = $("list");
    ol.innerHTML = "";
    $("playAllBtn").hidden = !entries.length;
    if (!entries.length) {
      var li = el("li");
      li.appendChild(el("div", "empty", "还没有收藏。听戏的时候点一下「收藏」，这段戏就会出现在这里。"));
      ol.appendChild(li);
    }
    entries.forEach(function (e) {
      var li = el("li");
      var b = el("button", "item" + (state.cur && state.cur.id === e.id ? " on" : ""));
      b.type = "button";
      b.appendChild(el("span", "a", "「" + e.aria + "」"));
      b.appendChild(el("span", "m", metaLine(e)));
      b.appendChild(el("span", "d", minutes(segLen(e)) + (e.note ? " · " + e.note : "")));
      b.addEventListener("click", function () {
        startQueue(entries.map(function (x) { return x.id; }), e.id, 0, hash);
      });
      li.appendChild(b);
      ol.appendChild(li);
    });
    $("playAllBtn").onclick = function () {
      startQueue(entries.map(function (x) { return x.id; }), entries[0].id, 0, hash);
    };
    $("v-list").classList.add("active");
  }

  // ---------- 播放 ----------
  // B 站嵌入播放器是跨域 iframe,外面拿不到它的播放进度和结束事件,
  // 所以这里按「加载时刻 + 唱段时长」估算进度:暂停 = 卸载播放器并记下位置,继续 = 从该位置重新加载。
  var state = {
    queue: [], idx: 0, cur: null, listHash: "#/",
    playing: false, startedAt: 0, base: 0, pausedAt: 0,
    ended: false, countdown: 0, sleepEnd: 0, sleepStep: 0
  };
  var wakeLock = null;

  function embedUrl(e, offset) {
    return "https://player.bilibili.com/player.html?isOutside=true&bvid=" + e.bvid +
      "&p=" + e.p + "&t=" + Math.floor(e.t + offset) + "&autoplay=1&danmaku=0";
  }
  function elapsed() {
    if (!state.playing) return state.pausedAt;
    return state.base + Math.max(0, (Date.now() - state.startedAt) / 1000);
  }
  function startQueue(ids, id, offset, listHash) {
    state.queue = ids;
    state.listHash = listHash || "#/";
    loadEntry(byId[id], offset || 0);
    go("#/play/" + id);
  }
  function loadEntry(e, offset) {
    offset = Math.max(0, Math.min(offset, segLen(e) - 10));
    state.cur = e;
    state.idx = Math.max(0, state.queue.indexOf(e.id));
    state.playing = true;
    state.ended = false;
    state.countdown = 0;
    state.base = offset;
    state.startedAt = Date.now() + LOAD_DELAY * 1000;
    $("overlay").hidden = true;
    $("banner").hidden = true;
    frame.src = embedUrl(e, offset);
    keepAwake(true);
    remember();
    paintPlayer();
  }
  function pause() {
    if (!state.cur || !state.playing) return;
    state.pausedAt = elapsed();
    state.playing = false;
    state.countdown = 0;
    $("banner").hidden = true;
    frame.src = "about:blank";
    keepAwake(false);
    remember();
    showOverlay("已经暂停了", "点下面的「继续听」，接着往下唱");
    paintPlayer();
  }
  function resume() {
    if (!state.cur) return;
    loadEntry(state.cur, state.ended ? 0 : state.pausedAt - 3);
  }
  function step(delta) {
    if (!state.queue.length) return;
    var i = (state.idx + delta + state.queue.length) % state.queue.length;
    var e = byId[state.queue[i]];
    loadEntry(e, 0);
    replaceHash("#/play/" + e.id);
  }
  function stopAll(message) {
    pause();
    $("mini").hidden = true;
    if (message) showOverlay(message, "想再听，点下面的红色大按钮");
  }
  function showOverlay(title, sub) {
    var o = $("overlay");
    o.innerHTML = "";
    o.appendChild(el("div", "", title));
    o.appendChild(el("div", "", sub));
    o.hidden = false;
  }
  function remember() {
    if (!state.cur) return;
    save("last", { id: state.cur.id, pos: Math.floor(elapsed()), queue: state.queue, listHash: state.listHash });
  }

  function showPlayer(e) {
    if (!state.cur || state.cur.id !== e.id) {
      // 直接打开分享来的播放地址时:队列用该剧种
      if (state.queue.indexOf(e.id) < 0) {
        state.queue = genreOf(e.genre).map(function (x) { return x.id; });
        state.listHash = "#/g/" + encodeURIComponent(e.genre);
      }
      loadEntry(e, 0);
    }
    $("barTitle").textContent = e.genre;
    $("v-player").classList.remove("parked");
    $("mini").hidden = true;
    paintPlayer();
  }
  function parkPlayer() {
    $("v-player").classList.add("parked");
    $("mini").hidden = !(state.cur && state.playing);
    if (state.cur) $("miniTitle").textContent = "「" + state.cur.aria + "」 " + state.cur.artist;
  }

  function paintPlayer() {
    var e = state.cur;
    if (!e) return;
    $("pAria").textContent = "「" + e.aria + "」";
    $("pMeta").textContent = metaLine(e) + " · " + minutes(segLen(e));
    $("pSrc").textContent = "来源：哔哩哔哩 · " + e.src;
    var pb = $("playBtn");
    pb.innerHTML = state.playing
      ? '<svg><use href="#i-pause"/></svg>暂停一下'
      : '<svg><use href="#i-play"/></svg>' + (state.ended ? "再听一遍" : "继续听");
    var many = state.queue.length > 1;
    $("prevBtn").disabled = !many;
    $("nextBtn").disabled = !many;
    $("nextBtn").classList.toggle("pulse", state.ended && many);
    var fav = favs.indexOf(e.id) >= 0;
    twoLine($("favBtn"), fav ? "★ 已收藏" : "☆ 收藏", fav ? "再点就取消" : "存起来常听", fav);
    var left = state.sleepEnd ? Math.max(1, Math.ceil((state.sleepEnd - Date.now()) / 60000)) : 0;
    twoLine($("sleepBtn"), "定时停止", left ? "还剩" + left + "分钟" : "现在不定时", !!left);
    twoLine($("autoBtn"), "自动下一段", prefs.autoNext ? "现在开着" : "现在关着", !!prefs.autoNext);
  }
  function twoLine(btn, main, sub, pressed) {
    btn.textContent = main;
    btn.appendChild(el("small", "", sub));
    btn.setAttribute("aria-pressed", String(pressed));
  }

  $("playBtn").addEventListener("click", function () { if (state.playing) pause(); else resume(); });
  $("prevBtn").addEventListener("click", function () { step(-1); });
  $("nextBtn").addEventListener("click", function () { step(1); });
  $("listBtn").addEventListener("click", function () { backTo(state.listHash); });
  $("favBtn").addEventListener("click", function () {
    var id = state.cur && state.cur.id;
    if (!id) return;
    var i = favs.indexOf(id);
    if (i >= 0) favs.splice(i, 1); else favs.push(id);
    save("fav", favs);
    paintPlayer();
  });
  $("sleepBtn").addEventListener("click", function () {
    state.sleepStep = (state.sleepStep + 1) % SLEEP_STEPS.length;
    var m = SLEEP_STEPS[state.sleepStep];
    state.sleepEnd = m ? Date.now() + m * 60000 : 0;
    paintPlayer();
  });
  $("autoBtn").addEventListener("click", function () {
    prefs.autoNext = !prefs.autoNext;
    save("prefs", prefs);
    if (!prefs.autoNext && state.countdown) { state.countdown = 0; showEnded(); }
    paintPlayer();
  });
  $("miniOpen").addEventListener("click", function () { if (state.cur) go("#/play/" + state.cur.id); });
  $("miniStop").addEventListener("click", function () { stopAll(); });

  function showEnded() {
    var b = $("banner");
    b.innerHTML = "";
    b.appendChild(el("div", "", "这一段唱完了。想听下一段，点「下一段」。"));
    b.hidden = false;
    paintPlayer();
  }
  // 倒计时横幅只建一次、每秒只改文字:整块重建会让老人按到一半的「不要接着放」失效
  var countdownText = null;
  function showCountdown(first) {
    var b = $("banner");
    var next = byId[state.queue[(state.idx + 1) % state.queue.length]];
    if (first || !countdownText || countdownText.parentNode !== b) {
      b.innerHTML = "";
      countdownText = el("div");
      b.appendChild(countdownText);
      var cancel = el("button", "", "不要接着放，停在这里");
      cancel.type = "button";
      cancel.addEventListener("click", function () {
        state.countdown = 0;
        stopAll("这一段唱完了");
        state.ended = true;
        paintPlayer();
      });
      b.appendChild(cancel);
      b.hidden = false;
    }
    countdownText.textContent = state.countdown + " 秒后接着放：「" + next.aria + "」 " + next.artist;
  }

  // 每秒一跳:估算是否唱完、倒计时、定时停止、记住位置
  var ticks = 0;
  setInterval(function () {
    if (state.sleepEnd && Date.now() >= state.sleepEnd) {
      state.sleepEnd = 0;
      state.sleepStep = 0;
      stopAll("定时到了，已经停了");
    }
    if (!state.cur || !state.playing) return;
    ticks++;
    if (ticks % 5 === 0) remember();
    if (ticks % 30 === 0) paintPlayer();   // 刷新「还剩几分钟」
    if (state.countdown > 0) {
      state.countdown--;
      if (state.countdown === 0) step(1); else showCountdown();
      return;
    }
    if (!state.ended && elapsed() >= segLen(state.cur) + END_GRACE) {
      state.ended = true;
      if (prefs.autoNext && state.queue.length > 1) { state.countdown = COUNTDOWN; showCountdown(true); }
      else { showEnded(); }
    }
  }, 1000);

  // 放戏时不让屏幕自动熄灭(手机锁屏后浏览器会把视频停掉)
  function keepAwake(on) {
    if (!("wakeLock" in navigator)) return;
    if (on && !wakeLock) {
      navigator.wakeLock.request("screen").then(function (lock) {
        wakeLock = lock;
        lock.addEventListener("release", function () { wakeLock = null; });
      }).catch(function () {});
    } else if (!on && wakeLock) {
      wakeLock.release().catch(function () {});
      wakeLock = null;
    }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && state.playing) keepAwake(true);
  });

  applySize();
  route();
})();
</script>
</body>
</html>
